<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dland Language - Sổ Tay Flashcard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">🌐</div>
        <div>
          <h1 class="brand-title">Dland Language</h1>
          <div class="sync-status" id="syncStatus">
            <span class="status-dot online"></span>
            <span id="syncStatusText">Sổ Tay Của Bạn</span>
          </div>
        </div>
      </div>
      <a href="http://localhost:3000/notebooks" target="_blank" class="btn-open-web" title="Mở trang Sổ Tay trên Web">
        <span>🌐 Web App</span>
      </a>
    </header>

    <!-- Stats Banner -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="totalNotebooksCount">0</span>
        <span class="stat-label">Sổ tay</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="totalVocabCount">0</span>
        <span class="stat-label">Tổng từ vựng</span>
      </div>
      <button type="button" class="btn-new-notebook" id="btnOpenNewNbModal">
        <span>➕ Tạo sổ mới</span>
      </button>
    </div>

    <!-- Search Input -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Tìm nhanh từ vựng hoặc sổ tay..." />
      <button type="button" id="clearSearchBtn" class="clear-search-btn" style="display: none;">✕</button>
    </div>

    <!-- Notebooks List Container -->
    <div class="notebooks-list" id="notebooksList">
      <div class="loading-state">
        <div class="spinner"></div>
        <span>Đang tải danh sách sổ tay...</span>
      </div>
    </div>

    <!-- New Notebook Modal -->
    <div class="modal-backdrop" id="newNbModal" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3>➕ Tạo Sổ Tay Mới</h3>
          <button type="button" class="btn-close" id="btnCloseNewNbModal">✕</button>
        </div>
        <div class="modal-body">
          <label>Tên sổ tay</label>
          <input type="text" id="newNbNameInput" placeholder="Ví dụ: Từ vựng đọc báo NHK..." />
          <label style="margin-top: 10px;">Ngôn ngữ</label>
          <select id="newNbLangSelect">
            <option value="ja">🇯🇵 Tiếng Nhật</option>
            <option value="en">🇬🇧 Tiếng Anh</option>
            <option value="de">🇩🇪 Tiếng Đức</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="btnCancelNewNb">Hủy</button>
          <button type="button" class="btn-primary" id="btnSubmitNewNb">Tạo sổ tay</button>
        </div>
      </div>
    </div>

    <!-- Add Word Modal -->
    <div class="modal-backdrop" id="addWordModal" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3>➕ Thêm Từ Vựng Vào Sổ</h3>
          <button type="button" class="btn-close" id="btnCloseAddWordModal">✕</button>
        </div>
        <div class="modal-body">
          <label>Từ vựng (Kanji / Từ gốc)</label>
          <input type="text" id="addWordKanji" placeholder="Ví dụ: 約束" />

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
            <div>
              <label>Hiragana / Cách đọc</label>
              <input type="text" id="addWordHiragana" placeholder="やくそく" />
            </div>
            <div>
              <label>Âm Hán Việt</label>
              <input type="text" id="addWordOnyomi" placeholder="ƯỚC THÚC" />
            </div>
          </div>

          <label style="margin-top: 8px;">Nghĩa tiếng Việt</label>
          <textarea id="addWordMeaning" placeholder="Lời hứa, hẹn ước..."></textarea>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
            <div>
              <label>Loại từ</label>
              <select id="addWordType">
                <option value="Danh từ">Danh từ</option>
                <option value="Động từ">Động từ</option>
                <option value="Tính từ">Tính từ</option>
                <option value="Phó từ">Phó từ</option>
                <option value="Khác">Khác</option>
              </select>
            </div>
            <div>
              <label>Sổ tay đích</label>
              <select id="addWordTargetNotebook"></select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="btnCancelAddWord">Hủy</button>
          <button type="button" class="btn-primary" id="btnSubmitAddWord">💾 Lưu từ vựng</button>
        </div>
      </div>
    </div>

    <!-- Footer Guide -->
    <footer class="footer">
      <span>💡 Bôi đen bất kỳ từ vựng nào trên trang web để hiện tooltip tra Mazii!</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
